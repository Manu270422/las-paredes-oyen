<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t-med d-med">
  <title id="t-med">La medición: seis segundos quieto y en silencio</title>
  <desc id="d-med">La grabadora registra el tono de sala de un apartamento. A mitad de la medición aparecen tres golpes en la pared, justo al lado del jugador.</desc>
  <defs>
    <clipPath id="zonaOnda"><rect x="40" y="70" width="880" height="160"/></clipPath>
  </defs>
  <style>
    .contenido { animation: contenido 9.5s infinite; }
    @keyframes contenido { 0% { opacity: 0; } 3.16%, 92.63% { opacity: 1; } 97.89%, 100% { opacity: 0; } }
    .cabezal { animation: cabezal 9.5s linear infinite; }
    @keyframes cabezal { 0%, 3.16% { transform: translateX(0); } 66.32%, 100% { transform: translateX(880px); } }
    .progreso { transform-box: fill-box; transform-origin: 0 50%; animation: progreso 9.5s linear infinite; }
    @keyframes progreso { 0%, 3.16% { transform: scaleX(0); } 66.32%, 100% { transform: scaleX(1); } }
    .golpes { animation: golpes 9.5s infinite; }
    @keyframes golpes { 0%, 30.4% { opacity: 0; } 31.6%, 92.63% { opacity: 1; } 97.89%, 100% { opacity: 0; } }
    .msj1 { animation: msj1 9.5s infinite; }
    @keyframes msj1 { 0%, 3% { opacity: 0; } 5%, 29.5% { opacity: 1; } 30.5%, 100% { opacity: 0; } }
    .msj2 { animation: msj2 9.5s infinite; }
    @keyframes msj2 { 0%, 30.5% { opacity: 0; } 31.6%, 65.5% { opacity: 1; } 66.5%, 100% { opacity: 0; } }
    .completa { animation: completa 9.5s infinite; }
    @keyframes completa { 0%, 66.3% { opacity: 0; } 68.5%, 92.63% { opacity: 1; } 97.89%, 100% { opacity: 0; } }
    .rec { animation: rec 1.2s steps(1) infinite; }
    @keyframes rec { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) {
      .contenido, .golpes, .completa, .msj1 { animation: none; opacity: 1; }
      .msj2 { animation: none; opacity: 0; }
      .cabezal { animation: none; transform: translateX(880px); }
      .progreso { animation: none; }
      .rec { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="959" height="319" rx="14" fill="#0b0908" stroke="#2a2420"/>

  <g font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="3">
    <circle class="rec" cx="48" cy="40" r="6" fill="#d24a3c"/>
    <text x="62" y="45" fill="#d24a3c">REC</text>
    <text x="126" y="45" fill="#8d877b">SALA 401 · TONO DE SALA</text>
    <text x="920" y="45" fill="#5b534a" text-anchor="end">EDIFICIO ALMENDROS</text>
  </g>

